services:
  db:
    image: postgres:16-alpine
    container_name: classup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classup}
      POSTGRES_DB: ${POSTGRES_DB:-classup}
    # Sem `ports:` — o Postgres NÃO é exposto ao host. Acessível apenas pela
    # rede interna do Docker (pelo serviço `api`), via o hostname `db`.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classup}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: classup-redis
    restart: unless-stopped
    # Exige senha mesmo na rede interna (um container comprometido não conecta
    # sem credencial; impede FLUSHALL/leitura anônima das chaves do rate-limit).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-classup}"]
    # Sem `ports:` — o Redis NÃO é exposto ao host. Acessível apenas pela rede
    # interna do Docker (pelo serviço `api`), via o hostname `redis`.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-classup}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: classup-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-ClassUp Backend}
      # development por padrão (dev stack). Em produção defina ENVIRONMENT=production
      # — isso ativa os guards (Host, store do rate-limit, debug) e desliga /docs.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      # Em produção com múltiplas réplicas, defina false e rode a migração como
      # etapa de deploy separada.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classup}:${POSTGRES_PASSWORD:-classup}@db:5432/${POSTGRES_DB:-classup}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-classup}@redis:6379/0
      # Host enviado pelo healthcheck. Em produção (TRUSTED_HOSTS restrito),
      # defina com um host permitido, ex.: HEALTHCHECK_HOST=api.classup.com.
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-127.0.0.1}
    # Bind em loopback por padrão (secure-by-default): a porta da app NÃO fica
    # exposta em todas as interfaces. Isso evita que um atacante alcance a app
    # contornando o proxy reverso — crítico com TRUST_PROXY=true, onde um acesso
    # direto com X-Forwarded-For forjado furaria o rate-limit por IP.
    # Em produção, o ideal é NÃO publicar a porta: ponha API e proxy na mesma
    # rede interna e exponha só o proxy (a app é alcançável via hostname `api`).
    # Para expor na LAN em dev, defina API_BIND=0.0.0.0 conscientemente.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8001}:8000"
    # Endurecimento do container (anti-DoS / contenção):
    read_only: true            # rootfs somente leitura
    tmpfs:
      - /tmp                   # único ponto gravável (efêmero)
    security_opt:
      - no-new-privileges:true # impede escalonamento via setuid
    cap_drop:
      - ALL                    # nenhuma capability do kernel
    pids_limit: 256            # limita fork bombs
    cpus: 1.0                  # teto de CPU
    mem_limit: 512m            # teto de memória

volumes:
  postgres_data:
