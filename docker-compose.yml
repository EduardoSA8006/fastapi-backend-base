# Segmentação de rede (least-privilege entre containers):
#   data_net      — api, worker, scheduler, db, minio (tasks legítimos usam banco/storage)
#   ratelimit_net — api e redis SOMENTE: worker/scheduler NÃO têm rota até o
#                   Redis do rate-limit — um task comprometido não
#                   alcança/flusha essas chaves.
#   taskiq_net    — api, worker, scheduler e redis-taskiq (broker/result
#                   backend dedicados); a api entra só para despachar .kiq().
services:
  db:
    image: postgres:18-alpine
    container_name: myapp-db
    restart: unless-stopped
    networks:
      - data_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myapp}
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      # PG18 mudou o PGDATA default (inclui a major). Fixa no caminho do mount
      # para preservar o volume postgres_data:/var/lib/postgresql/data.
      PGDATA: /var/lib/postgresql/data
    # Sem `ports:` — o Postgres NÃO é exposto ao host. Acessível apenas pela
    # rede interna do Docker (pelo serviço `api`), via o hostname `db`.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine # (digest pin vem na Task C3)
    container_name: myapp-redis
    restart: unless-stopped
    # Instância dedicada do rate-limit — segmentada de redis-taskiq (ver
    # ratelimit_net acima). Mesmo hardening do broker: `sh -c` para a senha vir
    # do environment (expandida pelo shell do container, não fica no argv
    # visível do compose):
    #   - rename-command "": desativa comandos destrutivos/de reconhecimento
    #     (um container comprometido não consegue FLUSH/varrer/reconfigurar);
    #   - maxmemory + noeviction: fail-closed — quando cheio, escrita falha
    #     alto (monitorável) em vez de descartar chaves de rate-limit
    #     silenciosamente, o que abriria uma janela sem limite;
    #   - appendonly no: contadores de rate-limit são transitórios, não
    #     precisam de durabilidade em disco.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command KEYS ""
        --rename-command CONFIG ""
        --rename-command DEBUG ""
        --maxmemory 64mb
        --maxmemory-policy noeviction
        --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-myapp}
    # Sem `ports:` — o Redis NÃO é exposto ao host. Acessível apenas pela rede
    # interna do Docker (pelo serviço `api`), via o hostname `redis`.
    expose:
      - "6379"
    healthcheck:
      # REDISCLI_AUTH (env) em vez de `-a senha`: a credencial não aparece em
      # `ps`/argv dentro do container durante o probe.
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 0.5
    mem_limit: 128m
    networks:
      - ratelimit_net

  redis-taskiq:
    image: redis:8-alpine
    container_name: myapp-redis-taskiq
    restart: unless-stopped
    # Broker + result backend DEDICADOS do TaskIQ — instância separada do
    # Redis do rate-limit (o guard de produção recusa apontá-los para a mesma
    # instância). `sh -c` para a senha vir do environment (expandida pelo
    # shell do container, não fica no argv visível do compose):
    #   - rename-command "": desativa comandos destrutivos/de reconhecimento
    #     (um task comprometido não consegue FLUSH/varrer/reconfigurar);
    #   - maxmemory + noeviction: broker NUNCA descarta mensagens
    #     silenciosamente — quando cheio, escrita falha alto (monitorável);
    #   - appendonly no: filas são transitórias; durabilidade vem do
    #     acks_late + redelivery, não do disco.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$TASKIQ_REDIS_PASSWORD"
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command KEYS ""
        --rename-command CONFIG ""
        --rename-command DEBUG ""
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --appendonly no
    environment:
      TASKIQ_REDIS_PASSWORD: ${TASKIQ_REDIS_PASSWORD:-myapp}
    # Sem `ports:` — não é exposto ao host; alcançável só em taskiq_net.
    expose:
      - "6379"
    healthcheck:
      # REDISCLI_AUTH (env) em vez de `-a senha`: a credencial não aparece em
      # `ps`/argv dentro do container durante o probe.
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$TASKIQ_REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 192m
    networks:
      - taskiq_net

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: myapp-minio
    restart: unless-stopped
    # `server /data` sobe o object store. `--console-address :9001` prende o
    # console a uma porta que NUNCA é exposta nem publicada — não há caminho de
    # fora deste container até a UI admin. Operação ad-hoc usa o `mc` embutido
    # via `docker exec`.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-myapp}
      # H3: senha em env é visível via `docker inspect`/proc — ok neste stack de
      # dev. Em PRODUÇÃO, prefira Docker secrets (/run/secrets) ou um secrets
      # manager. O boot da API é recusado com senha default/fraca em produção.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-myapp-minio-dev}
    # Sem `ports:` — o MinIO NÃO é exposto ao host. Acessível apenas pela rede
    # interna do Docker (pelo serviço `api`), via o hostname `minio`. Só a porta
    # da API S3 (9000) fica visível na rede interna; o console (9001) não.
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      # A imagem traz o `mc` (CLI do MinIO), não traz curl. `mc ready local`
      # retorna 0 quando o servidor está pronto para atender.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Endurecimento do container (sem read_only: o MinIO grava em /data):
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 256m
    networks:
      - data_net

  api:
    build: .
    container_name: myapp-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-taskiq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-MyApp Backend}
      # development por padrão (dev stack). Em produção defina ENVIRONMENT=production
      # — isso ativa os guards (Host, store do rate-limit, debug) e desliga /docs.
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      # Em produção com múltiplas réplicas, defina false e rode a migração como
      # etapa de deploy separada.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # H3: senhas embutidas em env são visíveis via `docker inspect` e em
      # /proc/<pid>/environ — aceitável neste stack de dev. Em PRODUÇÃO, prefira
      # Docker/Swarm secrets (arquivos em /run/secrets) ou um secrets manager;
      # o pydantic-settings lê de arquivos via `secrets_dir` (ex.: /run/secrets),
      # evitando expor a credencial no ambiente do processo.
      # H6: redis:// é texto puro — ok na rede interna do mesmo host. Se o Redis
      # cruzar a fronteira de host (gerenciado/outro nó), troque para rediss://
      # (TLS); o guard de senha do main.py já cobre rediss://.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-myapp}:${POSTGRES_PASSWORD:-myapp}@db:5432/${POSTGRES_DB:-myapp}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-myapp}@redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      # Configs de segurança lidas do ambiente do HOST. SEM estas linhas o
      # container não as recebe (o compose só injeta o que está aqui) — e em
      # produção o boot seria recusado por trusted_hosts=['*'] (default). Os
      # defaults abaixo preservam o comportamento de dev.
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["*"]}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-["*"]}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-["*"]}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NUM_TRUSTED_PROXIES: ${NUM_TRUSTED_PROXIES:-1}
      LOG_CLIENT_IP: ${LOG_CLIENT_IP:-true}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-1048576}
      # MinIO na rede interna (hostname `minio`, porta S3 9000). Só o backend
      # fala com ele; conteúdo é servido via proxy do FastAPI (nunca presigned
      # URL pública). minio_use_ssl=false: HTTP em texto puro é aceitável na
      # rede interna do mesmo host (mesma premissa do redis://). Em produção, o
      # boot é recusado com MINIO_ROOT_PASSWORD default/fraca.
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-myapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-myapp-minio-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-myapp-files}
      TASKIQ_BROKER_URL: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/0
      TASKIQ_RESULT_BACKEND: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/1
      # Host enviado pelo healthcheck. Em produção (TRUSTED_HOSTS restrito),
      # defina com um host permitido, ex.: HEALTHCHECK_HOST=api.myapp.com.
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-127.0.0.1}
    # Bind em loopback por padrão (secure-by-default): a porta da app NÃO fica
    # exposta em todas as interfaces. Isso evita que um atacante alcance a app
    # contornando o proxy reverso — crítico com TRUST_PROXY=true, onde um acesso
    # direto com X-Forwarded-For forjado furaria o rate-limit por IP.
    # Em produção, o ideal é NÃO publicar a porta: ponha API e proxy na mesma
    # rede interna e exponha só o proxy (a app é alcançável via hostname `api`).
    # Para expor na LAN em dev, defina API_BIND=0.0.0.0 conscientemente.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8001}:8000"
    # Endurecimento do container (anti-DoS / contenção):
    read_only: true            # rootfs somente leitura
    tmpfs:
      - /tmp                   # único ponto gravável (efêmero)
    security_opt:
      - no-new-privileges:true # impede escalonamento via setuid
    cap_drop:
      - ALL                    # nenhuma capability do kernel
    pids_limit: 256            # limita fork bombs
    cpus: 1.0                  # teto de CPU
    mem_limit: 512m            # teto de memória
    networks:
      - data_net
      - ratelimit_net
      - taskiq_net

  worker:
    build: .
    container_name: myapp-worker
    restart: unless-stopped
    command:
      ["taskiq", "worker", "app.worker:broker",
       "--ack-type", "when_executed", "--workers", "1", "--max-async-tasks", "2",
       "--log-level", "INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis-taskiq:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      RUN_MIGRATIONS_ON_START: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-myapp}:${POSTGRES_PASSWORD:-myapp}@db:5432/${POSTGRES_DB:-myapp}
      TASKIQ_BROKER_URL: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/0
      TASKIQ_RESULT_BACKEND: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-myapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-myapp-minio-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-myapp-files}
    healthcheck:
      # Round-trip real pelo broker (processo vivo != worker funcional).
      test: ["CMD-SHELL", "python -m app.worker_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    cpus: 1.0
    mem_limit: 512m
    networks: [data_net, taskiq_net]

  scheduler:
    build: .
    container_name: myapp-scheduler
    restart: unless-stopped
    # EXATAMENTE 1 réplica: dois schedulers = disparo em dobro.
    command: ["taskiq", "scheduler", "app.worker:scheduler", "--log-level", "INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis-taskiq:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      RUN_MIGRATIONS_ON_START: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-myapp}:${POSTGRES_PASSWORD:-myapp}@db:5432/${POSTGRES_DB:-myapp}
      TASKIQ_BROKER_URL: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/0
      TASKIQ_RESULT_BACKEND: redis://:${TASKIQ_REDIS_PASSWORD:-myapp}@redis-taskiq:6379/1
    healthcheck:
      # Sinal de vida do pipeline: a task agendada grava o marcador
      # myapp:taskiq:heartbeat (TTL 3x a cadência). Fresco => scheduler
      # publicou e o worker executou. TTL default = 180s.
      test:
        ["CMD-SHELL",
         "python -c \"import os,redis,sys; c=redis.from_url(os.environ['TASKIQ_BROKER_URL']); sys.exit(0 if c.get('myapp:taskiq:heartbeat') else 1)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 210s
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m
    networks: [data_net, taskiq_net]

volumes:
  postgres_data:
  minio_data:

networks:
  data_net:
  ratelimit_net:
  taskiq_net:
