# Segmentação de rede (least-privilege entre containers):
#   data_net      — api, worker, beat, db, minio (tasks legítimos usam banco/storage)
#   ratelimit_net — api e redis SOMENTE: worker/beat NÃO têm rota até o Redis
#                   do rate-limit — um task comprometido não alcança/flusha
#                   essas chaves.
#   celery_net    — api, worker, beat e redis-celery (broker/result backend
#                   dedicados); a api entra só para despachar .delay().
services:
  db:
    image: postgres:16-alpine
    container_name: classup-db
    restart: unless-stopped
    networks:
      - data_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-classup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classup}
      POSTGRES_DB: ${POSTGRES_DB:-classup}
    # Sem `ports:` — o Postgres NÃO é exposto ao host. Acessível apenas pela
    # rede interna do Docker (pelo serviço `api`), via o hostname `db`.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classup}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: classup-redis
    restart: unless-stopped
    # Exige senha mesmo na rede interna (um container comprometido não conecta
    # sem credencial; impede FLUSHALL/leitura anônima das chaves do rate-limit).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-classup}"]
    # Sem `ports:` — o Redis NÃO é exposto ao host. Acessível apenas pela rede
    # interna do Docker (pelo serviço `api`), via o hostname `redis`.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-classup}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ratelimit_net

  redis-celery:
    image: redis:7-alpine
    container_name: classup-redis-celery
    restart: unless-stopped
    # Broker + result backend DEDICADOS do Celery — instância separada do
    # Redis do rate-limit (o guard de produção recusa apontá-los para a mesma
    # instância). `sh -c` para a senha vir do environment (expandida pelo
    # shell do container, não fica no argv visível do compose):
    #   - rename-command "": desativa comandos destrutivos/de reconhecimento
    #     (um task comprometido não consegue FLUSH/varrer/reconfigurar);
    #   - maxmemory + noeviction: broker NUNCA descarta mensagens
    #     silenciosamente — quando cheio, escrita falha alto (monitorável);
    #   - appendonly no: filas são transitórias; durabilidade vem do
    #     acks_late + redelivery, não do disco.
    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$$CELERY_REDIS_PASSWORD"
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command KEYS ""
        --rename-command CONFIG ""
        --rename-command DEBUG ""
        --maxmemory 128mb
        --maxmemory-policy noeviction
        --appendonly no
    environment:
      CELERY_REDIS_PASSWORD: ${CELERY_REDIS_PASSWORD:-classup}
    # Sem `ports:` — não é exposto ao host; alcançável só em celery_net.
    expose:
      - "6379"
    healthcheck:
      # REDISCLI_AUTH (env) em vez de `-a senha`: a credencial não aparece em
      # `ps`/argv dentro do container durante o probe.
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$CELERY_REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 192m
    networks:
      - celery_net

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: classup-minio
    restart: unless-stopped
    # `server /data` sobe o object store. `--console-address :9001` prende o
    # console a uma porta que NUNCA é exposta nem publicada — não há caminho de
    # fora deste container até a UI admin. Operação ad-hoc usa o `mc` embutido
    # via `docker exec`.
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-classup}
      # H3: senha em env é visível via `docker inspect`/proc — ok neste stack de
      # dev. Em PRODUÇÃO, prefira Docker secrets (/run/secrets) ou um secrets
      # manager. O boot da API é recusado com senha default/fraca em produção.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-classup-minio-dev}
    # Sem `ports:` — o MinIO NÃO é exposto ao host. Acessível apenas pela rede
    # interna do Docker (pelo serviço `api`), via o hostname `minio`. Só a porta
    # da API S3 (9000) fica visível na rede interna; o console (9001) não.
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    healthcheck:
      # A imagem traz o `mc` (CLI do MinIO), não traz curl. `mc ready local`
      # retorna 0 quando o servidor está pronto para atender.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Endurecimento do container (sem read_only: o MinIO grava em /data):
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.5
    mem_limit: 256m
    networks:
      - data_net

  api:
    build: .
    container_name: classup-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-ClassUp Backend}
      # development por padrão (dev stack). Em produção defina ENVIRONMENT=production
      # — isso ativa os guards (Host, store do rate-limit, debug) e desliga /docs.
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      # Em produção com múltiplas réplicas, defina false e rode a migração como
      # etapa de deploy separada.
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # H3: senhas embutidas em env são visíveis via `docker inspect` e em
      # /proc/<pid>/environ — aceitável neste stack de dev. Em PRODUÇÃO, prefira
      # Docker/Swarm secrets (arquivos em /run/secrets) ou um secrets manager;
      # o pydantic-settings lê de arquivos via `secrets_dir` (ex.: /run/secrets),
      # evitando expor a credencial no ambiente do processo.
      # H6: redis:// é texto puro — ok na rede interna do mesmo host. Se o Redis
      # cruzar a fronteira de host (gerenciado/outro nó), troque para rediss://
      # (TLS); o guard de senha do main.py já cobre rediss://.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classup}:${POSTGRES_PASSWORD:-classup}@db:5432/${POSTGRES_DB:-classup}
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:-classup}@redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      # Configs de segurança lidas do ambiente do HOST. SEM estas linhas o
      # container não as recebe (o compose só injeta o que está aqui) — e em
      # produção o boot seria recusado por trusted_hosts=['*'] (default). Os
      # defaults abaixo preservam o comportamento de dev.
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["*"]}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-["*"]}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-["*"]}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NUM_TRUSTED_PROXIES: ${NUM_TRUSTED_PROXIES:-1}
      LOG_CLIENT_IP: ${LOG_CLIENT_IP:-true}
      MAX_BODY_SIZE: ${MAX_BODY_SIZE:-1048576}
      # MinIO na rede interna (hostname `minio`, porta S3 9000). Só o backend
      # fala com ele; conteúdo é servido via proxy do FastAPI (nunca presigned
      # URL pública). minio_use_ssl=false: HTTP em texto puro é aceitável na
      # rede interna do mesmo host (mesma premissa do redis://). Em produção, o
      # boot é recusado com MINIO_ROOT_PASSWORD default/fraca.
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-classup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-classup-minio-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-classup-files}
      # Celery: a api só DESPACHA tasks (.delay()) — broker/result backend na
      # instância dedicada (redis-celery), separada do Redis do rate-limit.
      CELERY_BROKER_URL: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/1
      # Host enviado pelo healthcheck. Em produção (TRUSTED_HOSTS restrito),
      # defina com um host permitido, ex.: HEALTHCHECK_HOST=api.classup.com.
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-127.0.0.1}
    # Bind em loopback por padrão (secure-by-default): a porta da app NÃO fica
    # exposta em todas as interfaces. Isso evita que um atacante alcance a app
    # contornando o proxy reverso — crítico com TRUST_PROXY=true, onde um acesso
    # direto com X-Forwarded-For forjado furaria o rate-limit por IP.
    # Em produção, o ideal é NÃO publicar a porta: ponha API e proxy na mesma
    # rede interna e exponha só o proxy (a app é alcançável via hostname `api`).
    # Para expor na LAN em dev, defina API_BIND=0.0.0.0 conscientemente.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8001}:8000"
    # Endurecimento do container (anti-DoS / contenção):
    read_only: true            # rootfs somente leitura
    tmpfs:
      - /tmp                   # único ponto gravável (efêmero)
    security_opt:
      - no-new-privileges:true # impede escalonamento via setuid
    cap_drop:
      - ALL                    # nenhuma capability do kernel
    pids_limit: 256            # limita fork bombs
    cpus: 1.0                  # teto de CPU
    mem_limit: 512m            # teto de memória
    networks:
      - data_net
      - ratelimit_net
      - celery_net

  worker:
    build: .
    container_name: classup-worker
    restart: unless-stopped
    # Mesma imagem da api; o entrypoint espera o banco mas NÃO migra
    # (RUN_MIGRATIONS_ON_START=false) — migração é responsabilidade da
    # api/etapa de deploy, evitando corrida entre containers.
    # Flags: --without-gossip/--mingle/--heartbeat desligam o chatter
    # peer-a-peer (um único worker não precisa; menos tráfego de controle no
    # broker = superfície menor). O control mailbox continua ativo — o
    # healthcheck `inspect ping` depende dele.
    command:
      [
        "celery", "-A", "app.worker", "worker",
        "--loglevel=info", "--concurrency=2",
        "--without-gossip", "--without-mingle", "--without-heartbeat",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      RUN_MIGRATIONS_ON_START: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classup}:${POSTGRES_PASSWORD:-classup}@db:5432/${POSTGRES_DB:-classup}
      CELERY_BROKER_URL: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/1
      # Tasks futuros alcançam o storage (data_net) com a MESMA credencial da
      # api — não há credencial separada porque o MinIO não tem contas com
      # escopo neste design (ver spec do MinIO).
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-classup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-classup-minio-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-classup-files}
    healthcheck:
      # Processo vivo ≠ worker funcional: `inspect ping` faz round-trip real
      # pelo broker e só responde se o loop de consumo está saudável.
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker inspect ping -d celery@$$HOSTNAME -t 5 | grep -q pong",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Mesmo endurecimento da api:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 1.0
    mem_limit: 512m
    # data_net (banco/storage p/ tasks) + celery_net (broker). NUNCA
    # ratelimit_net: um task comprometido não tem rota até o Redis do
    # rate-limit.
    networks:
      - data_net
      - celery_net

  beat:
    build: .
    container_name: classup-beat
    restart: unless-stopped
    # EXATAMENTE 1 réplica: dois beats = todo schedule disparado em dobro.
    # Se a topologia um dia escalar, migre para celery-redbeat (scheduler
    # Redis com lock distribuído). O arquivo de schedule fica em /tmp
    # (tmpfs, efêmero de propósito — o beat o reconstrói do beat_schedule
    # no boot; nada nele é fonte de verdade).
    command:
      [
        "celery", "-A", "app.worker", "beat",
        "--loglevel=info", "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis-celery:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?defina ENVIRONMENT (development/staging/production) — sem default por segurança}
      RUN_MIGRATIONS_ON_START: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classup}:${POSTGRES_PASSWORD:-classup}@db:5432/${POSTGRES_DB:-classup}
      CELERY_BROKER_URL: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/0
      CELERY_RESULT_BACKEND: redis://:${CELERY_REDIS_PASSWORD:-classup}@redis-celery:6379/1
    healthcheck:
      # Beat não executa tasks — só publica no broker. Sinal de vida: o
      # arquivo de schedule é sincronizado periodicamente (PersistentScheduler
      # sincroniza a cada ~3min; o heartbeat de 60s garante atividade).
      # Janela de 10min = 3 chances de sync antes de acusar unhealthy.
      test:
        [
          "CMD-SHELL",
          "python -c \"import glob,os,sys,time; fs=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(0 if fs and time.time()-max(os.path.getmtime(f) for f in fs)<600 else 1)\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      # Folga para o primeiro sync do scheduler (~180s) + boot lento: não
      # acusa unhealthy antes de o arquivo ter chance real de existir.
      start_period: 210s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m
    networks:
      - data_net
      - celery_net

volumes:
  postgres_data:
  minio_data:

networks:
  data_net:
  ratelimit_net:
  celery_net:
