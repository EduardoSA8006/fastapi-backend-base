name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só lê o código e roda testes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (tags são mutáveis — cadeia de suprimentos).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Formatação (ruff format)
        run: poetry run ruff format --check .

      - name: Checagem de tipos (mypy --strict)
        run: poetry run mypy .

      - name: Testes + cobertura (pytest, gate 90%)
        run: poetry run pytest

      - name: Auditoria de dependências (pip-audit)
        run: poetry run pip-audit
