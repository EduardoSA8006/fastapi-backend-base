name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só lê o código e roda testes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions fixadas por SHA (tags são mutáveis — cadeia de suprimentos).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatação (ruff format)
        run: uv run ruff format --check .

      - name: Checagem de tipos (mypy --strict)
        run: uv run mypy .

      - name: Testes + cobertura (pytest, gate 90%)
        run: uv run pytest

      - name: Auditoria de dependências (pip-audit)
        # O upgrade do pip cobre CVEs do próprio pip do venv (ex.:
        # PYSEC-2026-196) — o pip-audit audita o ambiente inteiro, incluindo-o.
        run: |
          uv run python -m pip install --upgrade pip
          uv run pip-audit

  # Testes de integração: infra real efêmera (Postgres/Redis/MinIO via
  # testcontainers) — o runner ubuntu-latest traz Docker. Roda em paralelo ao
  # job `test` (que permanece o gate rápido de lint/tipos/cobertura).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Testes de integração (testcontainers)
        run: uv run pytest -m integration --no-cov

  # E2E: sobe o stack compose completo (projetos isolados myapp-e2e*) e o
  # ataca de fora com httpx — inclui o invariante de isolamento de rede e o
  # stack em modo production com credenciais fortes geradas no teste.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Instalar uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Testes e2e (compose + httpx)
        run: uv run pytest -m e2e --no-cov

  # SAST do código Python já é coberto pelas regras `S` (bandit) do ruff no job
  # acima; aqui ficam o secret scanning e o scan da imagem Docker.
  security:
    runs-on: ubuntu-latest
    # Em pull_request, o gitleaks lê os commits do PR (GET .../pulls/{n}/commits)
    # para definir o range do scan — isso exige pull-requests:read (o default
    # contents:read não basta). Mantém-se read-only: nada de escrita.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # histórico completo para o secret scanning

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentar no PR usa a API do GitHub (escrita) e exige pull-requests:write;
          # com o token em contents:read isso falha com "Resource not accessible by
          # integration". O scan em si não precisa do token — desligamos o comentário
          # (mantendo o menor privilégio). O resultado segue no job summary e no log.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Build da imagem
        run: docker build -t myapp-backend:ci .

      - name: Scan da imagem (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: myapp-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
