[project]
name = "myapp-backend"
version = "0.1.0"
description = "Backend da aplicação MyApp em FastAPI"
authors = [
    {name = "Eduardo8006",email = "eduardoalves8006@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "uvicorn[standard]>=0.52.2,<0.53.0",
    "sqlalchemy>=2.0.52,<3.0.0",
    "alembic>=1.19.1,<2.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "slowapi>=0.1.10,<0.2.0",
    # redis: kombu (Celery) capa em <6.5; a interseção resolve para 6.4.x.
    # Sai da trava só na Fase 4 (TaskIQ exige redis>=8; Celery/kombu saem).
    "redis>=6.4.0,<9.0.0",
    "celery[redis]>=5.6,<6.0",
    "minio>=7.2.20,<8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (segurança)
    "ASYNC",  # flake8-async
    "SIM",    # flake8-simplify
    "PT",     # flake8-pytest-style
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "RUF",    # regras específicas do ruff
]

[tool.ruff.lint.per-file-ignores]
# Testes podem usar assert (S101) e credenciais literais de fixture (S105/
# S106) — senhas de teste embutidas são intencionais (exercitam guards e
# containers efêmeros). S603: subprocess nos testes de integração/e2e roda
# comandos fixos (docker/alembic), sem entrada não confiável.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
# Padrão do FastAPI: chamadas em defaults de argumentos (injeção de dependência).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
# mutants/ é a árvore de trabalho do mutmut (gitignored) — duplicaria "app".
exclude = ["^mutants/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# slowapi não distribui informações de tipo (py.typed).
module = ["slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery e testcontainers não distribuem informações de tipo (py.typed).
module = ["celery.*", "celery", "testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# O decorator @celery_app.task não é tipado (celery sem py.typed);
# em strict isso reprovaria toda task. Relaxa só neste módulo.
module = ["app.worker"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default = suíte unitária rápida (gate de cobertura). Integração/e2e exigem
# Docker e rodam sob demanda:
#   uv run pytest -m integration --no-cov
#   uv run pytest -m e2e --no-cov
addopts = '--cov=app --cov-report=term-missing --cov-fail-under=90 -m "not integration and not e2e"'
markers = [
    "integration: exige Docker — infra real efêmera via testcontainers",
    "e2e: exige Docker — sobe o stack compose isolado (myapp-e2e) e ataca de fora com httpx",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "ruff>=0.15.15,<0.16.0",
    "pip-audit>=2.10.0,<3.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "testcontainers>=4.14.2,<5.0.0",
    "hypothesis>=6.155.2,<7.0.0",
    "mutmut>=3.5.0,<4.0.0",
]

[tool.mutmut]
# Mutation testing — métrica LOCAL (não é gate de CI; ver README).
# Mata-se mutantes com a suíte unitária (rápida); rodar:
#   uv run mutmut run && uv run mutmut results
paths_to_mutate = [ "app/" ]
tests_dir = [ "tests/" ]
# Funções com assinatura INTROSPECTADA pelo FastAPI (rotas e dependências):
# o trampolim do mutmut troca a assinatura e quebra a injeção — exclui-se o
# arquivo da mutação (limitação documentada; cobertos por testes normais).
do_not_mutate = [ "app/features/health/router.py", "app/core/database.py" ]
# Sem cobertura na execução dos mutantes: as funções-mutante geradas nunca
# executam e derrubariam o gate de 90% mesmo com a suíte toda verde.
pytest_add_cli_args = [ "--no-cov" ]
